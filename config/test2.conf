# ==============================================================================
# THE ULTIMATE PARSER STRESS TEST
# Tests inheritance, bitwise shifting, map insertions, and memory wiping.
# ==============================================================================

# ------------------------------------------------------------------------------
# SERVER 1: THE STANDARD & OVERRIDE TEST
# Tests standard parsing and location-specific overrides.
# ------------------------------------------------------------------------------
server {
    listen 127.0.0.1:8080;
    server_name yosskavo.com www.yosskavo.com;
    
    root /var/www/yosskavo_main;
    index global.html;
    autoindex off;
    client_max_body_size 10M;

    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    # Route 1: Inherits everything, adds nothing special.
    location / {
        allow_methods GET;
    }

    # Route 2: Overrides root, appends multiple indexes.
    location /assets {
        allow_methods GET;
        root /var/www/media;
        index index.html default.html;
        autoindex on;
    }

    # Route 3: Tests the upload boolean and Gigabyte bitwise shift.
    location /upload {
        allow_methods POST GET;
        client_max_body_size 2G;
        upload_enable on;
        upload_store /var/www/uploads;
    }

    # Route 4: Tests the map insertions for CGI.
    location /cgi-bin {
        allow_methods GET POST;
        cgi_ext .php /usr/bin/php-cgi;
        cgi_ext .py /usr/bin/python3;
    }
}

# ------------------------------------------------------------------------------
# SERVER 2: THE MINIMALIST DEFAULT TEST
# Tests your default constructors. Almost everything is missing!
# ------------------------------------------------------------------------------
server {
    server_name api.yosskavo.local;
    
    # Route 1: A completely empty block. Must inherit the server defaults 
    # (which should be YOUR C++ constructor defaults since the server lacks them).
    location /empty {
    }
}

# ------------------------------------------------------------------------------
# SERVER 3: THE REDIRECTION & LEAK TEST
# Tests if memory leaks from Server 1 into Server 3, and tests return codes.
# ------------------------------------------------------------------------------
server {
    listen 9090;
    root /var/www/legacy;
    client_max_body_size 500K;

    # Route 1: Tests integer to string parsing for redirection.
    location /old_path {
        return 301 /new_path/index.html;
    }
}
