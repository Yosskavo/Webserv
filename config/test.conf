# ==============================================================================
# THE MONOLITHIC STRESS TEST
# Save as: webserv.conf
# ==============================================================================
server {
    # --- 1. The Network Binding ---
    # Trap: Port only, no IP address provided.
    listen 12.12.12.12:9090;

    # --- 2. The Vector Loop Trap ---
    # Trap: Four distinct strings before the semicolon.
    server_name api.yosskavo.com test.local dev.yosskavo.com staging.local;

    # --- 3. The Bitwise Shift / Overflow Trap ---
    # Trap: Gigabyte suffix requiring the (number << 30) shift.
    client_max_body_size 2G;

    # --- 4. The Standard Inheritable Defaults ---
    root /var/www/yosskavo_main;
    index index.html; # default.html fallback.php;
    autoindex on;
	
	allow_methods GET;
    # --- 5. The Map Insertion / Mixed-Type Trap ---
    # Trap: Four integer keys pointing to the exact same string value.
    error_page 500 502 503 504 /errors/50x.html;
    
    # Standard 1-to-1 map insertion
    error_page 404 /errors/not_found.html;
}


server {
    # --- 1. The Network Binding ---
    # Trap: Port only, no IP address provided.
    listen 9090;

    # --- 2. The Vector Loop Trap ---
    # Trap: Four distinct strings before the semicolon.
    server_name api.yosskavo.com test.local dev.yosskavo.com staging.local;

    # --- 3. The Bitwise Shift / Overflow Trap ---
    # Trap: Gigabyte suffix requiring the (number << 30) shift.
    client_max_body_size 2G;

    # --- 4. The Standard Inheritable Defaults ---
    root /var/www/yosskavo_main;
    index index.html; # default.html fallback.php;
    autoindex on;
	
	allow_methods GET;
    # --- 5. The Map Insertion / Mixed-Type Trap ---
    # Trap: Four integer keys pointing to the exact same string value.
    error_page 500 502 503 504 /errors/50x.html;
    
    # Standard 1-to-1 map insertion
    error_page 404 /errors/not_found.html;


	# ==============================================================================
	# THE LOCATION STRESS TEST
	# Save as: location_test.conf
	# Note: These blocks must eventually live inside a 'server { }' block.
	# ==============================================================================

	# --- 1. The Standard Routing Block ---
	# Tests your mini-loops for allowed methods and index fallbacks.
	location /assets {
		allow_methods GET;
		root /var/www/media;
		index index.html default.html;
		autoindex on;
	}

	# --- 2. The Upload Handler Block ---
	# Tests the upload booleans and storage pathing.
	location /upload {
		allow_methods POST GET;
		root /var/www/data;
		upload_enable on;
		upload_store /var/www/data/tmp_uploads;
	}

	# --- 3. The CGI Gateway Block ---
	# Tests your map insertions for file extensions and binaries.
	location /cgi-bin {
		allow_methods GET POST;
		root /var/www/scripts;
		cgi_ext .php /usr/bin/php-cgi;
		cgi_ext .py /usr/bin/python3;
	}

	# --- 4. The Redirection (Return) Block ---
	# Tests integer/string parsing for HTTP redirects.
	location /old_site {
		allow_methods GET;
		return 301 /new_site/index.html;
	}

	# --- 5. The Minimalist Block ---
	# Tests your struct's default constructors and server-level inheritance.
	# (Assuming 'root' and 'index' are inherited from the parent server)
	location /minimal {
		allow_methods GET;
	}
}
