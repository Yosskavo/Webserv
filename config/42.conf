server {
	listen 127.0.0.1:8080;
	server_name localhost;
	root ./YoupiBanane;
	index youpi.bad_extension;
	client_max_body_size 1000000000;
	
	location / {
		allow_methods GET;
	}

	location /put_test/ {
		allow_methods POST;
		root ./YoupiBanane/put_here;
	}

	location /post_body {
		allow_methods POST;
		client_max_body_size 100;
	}

	location /directory/ {
		allow_methods GET POST;
		root ./YoupiBanane;
		index youpi.bad_extension;
		cgi_ext .bla ./cgi_tester;
	}
}
