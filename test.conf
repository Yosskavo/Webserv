# ==============================================================================
 MAIN SERVER BLOCK
# ==============================================================================
server {
    # --- Global Server Rules ---
    listen 127.0.0.1:8080;
    server_name yosskavo.com;
    client_max_body_size 10M;
    
    error_page 404 /errors/not_found.html;
    error_page 403 /errors/forbidden.html;

    # --- Route 1: The Default Homepage ---
    location / {
        allow_methods GET POST;
        root ./www/public;
        index index.html;
        autoindex off;
    }

    # --- Route 2: Directory Listing (No index file) ---
    location /assets {
        allow_methods GET;
        root ./www/media;
        autoindex on;
    }

    # --- Route 3: File Uploads ---
    location /upload {
        allow_methods POST;
        root ./www/data;
        upload_enable on;
        upload_store ./www/data/tmp_uploads;
    }

    # --- Route 4: HTTP Redirection ---
    location /old_website {
        allow_methods GET;
        return 301 /new_website.html;
    }

    # --- Route 5: CGI Script Execution ---
    location /scripts {
        allow_methods GET POST;
        root ./www/cgi-bin;
        cgi_ext .php /usr/bin/php-cgi;
        cgi_ext .py /usr/bin/python3;
    }
}

# ==============================================================================
# SECONDARY SERVER BLOCK (Virtual Hosting)
# ==============================================================================
server {
    listen 127.0.0.1:9090;
    server_name test_environment.local;
    client_max_body_size 1M;

    location / {
        allow_methods GET;
        root ./www/test_site;
        index default.html;
        autoindex off;
    }
}
