# ==============================================================================
# THE MONOLITHIC STRESS TEST
# Save as: webserv.conf
# ==============================================================================
server {
    # --- 1. The Network Binding ---
    # Trap: Port only, no IP address provided.
    listen 12.12.12.12:9090;

    # --- 2. The Vector Loop Trap ---
    # Trap: Four distinct strings before the semicolon.
    server_name api.yosskavo.com test.local dev.yosskavo.com staging.local;

    # --- 3. The Bitwise Shift / Overflow Trap ---
    # Trap: Gigabyte suffix requiring the (number << 30) shift.
    client_max_body_size 2G;

    # --- 4. The Standard Inheritable Defaults ---
    root /var/www/yosskavo_main;
    index index.html; # default.html fallback.php;
    autoindex on;
	
	allow_methods GET;
    # --- 5. The Map Insertion / Mixed-Type Trap ---
    # Trap: Four integer keys pointing to the exact same string value.
    error_page 500 502 503 504 /errors/50x.html;
    
    # Standard 1-to-1 map insertion
    error_page 404 /errors/not_found.html;
}


